# Which files the docs gate judges. The rules themselves are in
# .markdownlint.yaml, which markdownlint-cli2 picks up on its own.
#
# markdownlint-cli2 does not read .gitignore, so without this it lints
# .claude/ — scratch planning notes that are gitignored and not part of the
# project — and fails CI on files that are not even in the repository.
globs:
  - "**/*.md"

ignores:
  - ".claude/**"
  - "site/public/**"
  - "node_modules/**"
  # Generated by `changie merge` from changes/. Style-fixing here would be
  # fixing the output instead of the template; changes/header.tpl.md is the
  # file to edit, and it is linted.
  - "CHANGELOG.md"
