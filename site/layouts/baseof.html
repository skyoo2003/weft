<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}A search engine where ranking signals are interchangeable. Go, standard library only.{{ end }}">
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fff; --muted: #666; --rule: #e3e3e3; --accent: #0a7; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6e6e6; --bg: #16181c; --muted: #9aa0a6; --rule: #2c3038; --accent: #3cc; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 46rem; padding: 2rem 1.25rem 5rem;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--fg); background: var(--bg);
  }
  header { border-bottom: 1px solid var(--rule); padding-bottom: .75rem; margin-bottom: 2rem; overflow: hidden; }
  header a.brand { font-weight: 600; text-decoration: none; color: var(--fg); }
  header nav { float: right; font-size: .9rem; }
  header nav a { color: var(--muted); }
  h1, h2, h3 { line-height: 1.25; }
  h1 { font-size: 1.9rem; }
  h2 { margin-top: 2.25rem; border-bottom: 1px solid var(--rule); padding-bottom: .3rem; }
  a { color: var(--accent); }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; }
  code { background: color-mix(in srgb, var(--fg) 8%, transparent); padding: .12em .35em; border-radius: 3px; }
  pre { background: color-mix(in srgb, var(--fg) 6%, transparent); padding: .9rem 1rem; overflow-x: auto; border-radius: 5px; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; margin: 1.25rem 0; font-size: .93rem; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--rule); padding: .45rem .6rem; text-align: left; vertical-align: top; }
  th { background: color-mix(in srgb, var(--fg) 5%, transparent); }
  blockquote { margin: 1.25rem 0; padding-left: 1rem; border-left: 3px solid var(--rule); color: var(--muted); }
  footer { margin-top: 4rem; padding-top: 1rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .875rem; }
</style>
</head>
<body>
<header>
  <nav><a href="{{ site.Params.repo }}">GitHub</a></nav>
  {{/* Home.RelPermalink, not `"/" | relURL`: the site is served from a
       /weft/ subpath on Pages, and relURL of "/" drops it. */}}
  <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
</header>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer>
  Apache-2.0. Built from <a href="{{ site.Params.repo }}/tree/main/docs">the repository's docs directory</a> — these pages are not a separate copy.
</footer>
</body>
</html>
