# Questions get a blank issue rather than a form. There is no Discussions tab and
# no chat channel by choice, so the tracker is the only place to ask, and making
# someone fill a form to ask a question would close the last door.
blank_issues_enabled: true

contact_links:
  # Straight to the private report form rather than to SECURITY.md: someone who
  # has picked this link has already decided what they are reporting, and the
  # policy is one click away from the form. The line that sent them to a mailbox
  # is gone — SECURITY.md keeps the address as a fallback, but offering it here
  # made the weaker of the two routes the default.
  - name: Reporting a vulnerability
    url: https://github.com/skyoo2003/weft/security/advisories/new
    about: Not here. Report it privately on the Security tab; SECURITY.md has the policy and an email fallback.

  - name: Known limitations
    url: https://github.com/skyoo2003/weft/blob/main/README.md#limitations
    about: >-
      No deletion, a commit blocks reads, throughput collapses under sustained
      load, no CJK tokenization, no query language. All documented and deliberate.

  - name: Already decided against
    url: https://github.com/skyoo2003/weft/blob/main/docs/DECISIONS.md
    about: Choices expensive to reverse, with the reasoning that settled them.

  - name: Measured, and not yet measured
    url: https://github.com/skyoo2003/weft/blob/main/docs/FINDINGS.md
    about: What the milestones actually proved, and which numbers are still guesses.
