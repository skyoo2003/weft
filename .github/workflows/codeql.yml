name: CodeQL

# Separate from ci.yml on purpose. That file says the gate is `make all`, and
# CodeQL is not something make can call or a contributor can run locally, so
# folding it in would make that sentence false. It also answers a different
# question on a different schedule: the weekly run exists because the rules
# change even when the code does not.
#
# Findings are reported, not enforced. Nothing here blocks a merge — a false
# positive stopping a one-maintainer project from shipping would cost more than
# the finding is worth. SECURITY.md names the surfaces that matter; this is one
# of the things watching them.

on:
  push:
    branches: [main]
    paths: ['**/*.go']
  pull_request:
    branches: [main]
    paths: ['**/*.go']
  schedule:
    - cron: "15 3 * * 1"

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # checkout v7.0.1

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # codeql-action v4
        with:
          languages: go
          build-mode: autobuild

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # codeql-action v4
        with:
          category: "/language:go"
