name: Release

# Runs on a tag that has already been pushed, so like the CI run on the same
# tag it reports rather than prevents. RELEASE.md is where the prevention
# lives: confirm the commit is green, then tag it.
#
# Two things it does refuse outright, both within seconds and both for the same
# reason: they are release-time facts, so CI cannot judge them. A commit is not
# wrong for lacking changes/v0.1.0.md until someone tags it, and it is not wrong
# for lacking a tap credential until someone asks it to publish a cask. Refusing
# early is what keeps a missing secret from surfacing five minutes in, after
# everything has been built and half of it published.

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the GitHub release and upload archives
      packages: write     # push the container image to ghcr.io
      id-token: write     # keyless signing material for the attestation
      attestations: write # provenance for the archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # checkout v7.0.1
        with:
          # GoReleaser needs the tag history to resolve the version.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # setup-go v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify the changie release notes exist
        run: |
          if [ ! -f "changes/${GITHUB_REF_NAME}.md" ]; then
            echo "::error::changes/${GITHUB_REF_NAME}.md not found."
            echo "::error::Run 'changie batch ${GITHUB_REF_NAME}' and 'make changelog', commit, then tag that commit. See RELEASE.md step 1."
            exit 1
          fi

      # Read as a value rather than tested with `secrets.X != ''`, because a
      # workflow-level `if:` on a secret is exactly the shape that silently
      # evaluates false and skips the step that was supposed to complain.
      - name: Verify the Homebrew tap credentials exist
        env:
          TAP_APP_ID: ${{ secrets.TAP_APP_ID }}
          TAP_APP_PRIVATE_KEY: ${{ secrets.TAP_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$TAP_APP_ID" ] || [ -z "$TAP_APP_PRIVATE_KEY" ]; then
            echo "::error::TAP_APP_ID and TAP_APP_PRIVATE_KEY are not both set on this repository."
            echo "::error::Install the tap GitHub App here, add both secrets, then re-run this workflow. See RELEASE.md."
            exit 1
          fi

      # `sboms:` in .goreleaser.yaml shells out to syft, which a clean runner
      # does not have. Without this the release fails after the archives are
      # built and before anything is published.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # sbom-action v0.24.2

      # No QEMU and no binfmt step. Dockerfile.goreleaser's final stage is
      # COPY-only, so buildx assembles linux/arm64 on this amd64 runner without
      # emulating anything. The Dockerfile says the same at the top, and the
      # two have to stay true together.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # setup-buildx-action v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # login-action v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Expires with the job and can write to skyoo2003/homebrew-tap and
      # nothing else. GITHUB_TOKEN above cannot reach another repository at
      # all, which is the whole reason this step exists.
      - name: Mint a Homebrew tap token
        id: tap_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # create-github-app-token v3.2.0
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: skyoo2003
          repositories: homebrew-tap

      - name: Execute GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # goreleaser-action v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes changes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap_token.outputs.token }}

      # GoReleaser 2.18 still emits the deprecated `postflight` stanza.
      # Rewrite only its generated quarantine hook before the release job ends.
      - name: Modernize the generated Homebrew cask
        env:
          GH_TOKEN: ${{ steps.tap_token.outputs.token }}
        run: |
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          gh repo clone skyoo2003/homebrew-tap "$tap_dir"
          ruby scripts/modernize-homebrew-cask.rb "$tap_dir/Casks/weft.rb"
          git -C "$tap_dir" diff --check
          if ! git -C "$tap_dir" diff --quiet; then
            git -C "$tap_dir" config user.name "github-actions[bot]"
            git -C "$tap_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$tap_dir" add Casks/weft.rb
            git -C "$tap_dir" commit -m "Modernize weft cask postflight steps"
            git -C "$tap_dir" push
          fi

      # The permissions above only authorize an attestation; this step is what
      # makes one. Named against the archives rather than checksums.txt so that
      # `gh attestation verify` works on the file someone downloaded.
      - name: Attest the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # attest-build-provenance v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
