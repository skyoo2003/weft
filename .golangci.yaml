version: "2"

# What this adds over `go vet`, which the gate already runs: unchecked errors,
# the gosec rules that matter to a package that parses files it did not write,
# and staticcheck. It is a CI tool, not a module requirement — `go.mod` stays
# empty and TestNoExternalDependencies stays the judge of that.
#
# Every exclusion below names the thing that makes the finding wrong here. An
# exclusion without one is a finding nobody read.

run:
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - noctx
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    errcheck:
      # A deferred Close on a handle opened for reading has nothing to report
      # that the read itself did not already report. Where a dropped error is
      # load-bearing rather than empty — prune, syncDir — the call carries a
      # nolint naming the sentence above it that explains why.
      exclude-functions:
        - (*os.Root).Close
        - (*os.File).Close
    funlen:
      lines: 100
      statements: 50
    gosec:
      excludes:
        # G104 asks errcheck's question with a different vocabulary: it does not
        # read `//nolint:errcheck`, and it cannot be told that a deferred Close
        # on a read handle has nothing to report. errcheck is enabled above and
        # configured for exactly that, so this would be a second judge of one
        # question, disagreeing with the first by construction.
        - G104
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - sprintfQuotedString
        - whyNoLint
        - wrapperFunc
        # Document is 104 bytes and Index.Add takes it by value on purpose: the
        # signature is in pkg/engine/testdata/engine_api.txt, and a pointer
        # would hand callers a way to mutate an indexed document after the fact.
        - hugeParam
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      # 20 rather than the usual 15: a scorer's Candidates is a fold over the
      # whole corpus with a guard per document, so it clears 15 while staying
      # one readable loop.
      min-complexity: 20
    lll:
      line-length: 160
    misspell:
      # No locale. This repository spells "neighbour" and "cancelled", and
      # pinning a locale would turn misspell — which is here to catch typos —
      # into a rewriter of prose that is not wrong.
      ignore-rules:
        - weft
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
    rules:
      # Test files are allowed the shapes that make a test readable: an ignored
      # error on a cleanup call, a constant repeated across table rows, and a
      # long table row.
      - linters:
          - errcheck
          - gosec
          - goconst
          - funlen
          - gocyclo
          - lll
        path: _test\.go$

      # G115 flags every width change in the decoder, and in the encoder that
      # feeds it. Each one is already bounded, by one of the two guards these
      # files exist to apply.
      #
      # Reading, the finding is backwards — it fires precisely where the guard
      # is. segReader.intn compares against the limit in uint64 before
      # converting and str checks the length against what is left of the
      # buffer; readManifest refuses a segment base that runs past the document
      # ceiling two lines above converting it, and keyTable.at range-checks an
      # offset against the section before seeking to it.
      #
      # Writing, every id and count converted is a position in a collection Add
      # has already capped at maxDocCount — a DocID that did not fit is a
      # document the index refused to hold.
      - linters:
          - gosec
        text: "G115"
        path: pkg/engine/(segment|segments|index|merge|persist|seek)\.go$

      # decodeDocs and decodePostings are branchy and long because every branch
      # is a corruption check on a file weft did not write. Splitting them to
      # reach a number would scatter the checks away from the reads they guard.
      - linters:
          - gocyclo
          - funlen
        path: pkg/engine/segment\.go$

      # readManifest is that shape one file over, on the most reachable file in
      # the format: the manifest is what a doctored directory presents first,
      # and it names the segment paths every later read follows. Every branch
      # refuses something — a name carrying a path separator, a base that does
      # not continue the one before it, a count that runs past the document
      # ceiling — so the complexity is the refusal count, not tangled control
      # flow, and the refusals have to stay next to the reads that produce what
      # they refuse. funlen is paired here for the reason it is paired above: it
      # counts the same guards a second time, as statements rather than as
      # branches, and reaching its number means deleting the same checks.
      - linters:
          - gocyclo
          - funlen
        path: pkg/engine/persist\.go$

      # cmd/weft is a demo whose corpus is a literal table. Wrapping those rows
      # or lifting their keys into constants makes the data harder to read,
      # which is the only thing that file is for.
      - linters:
          - lll
          - goconst
        path: cmd/weft/main\.go$

      # The eval harness's subcommands are branchy for one reason: almost every
      # branch is a refusal. prepare and build are the two commands docs/EVAL.md
      # section 4.1 exists because of — a run that completed, reported a
      # plausible number, and had measured a corpus that was 40% absent — and
      # the answer to that was a guard per way the inputs can disagree, each one
      # placed at the step whose result it invalidates. Splitting them to reach
      # 20 moves the guards away from what they guard, which is the property
      # that makes them readable as a sequence. Complexity here is the check
      # count, not tangled control flow. funlen counts the same guards a second
      # time, so it is paired here exactly as it is on segment.go above.
      - linters:
          - gocyclo
          - funlen
        path: cmd/weft-eval/(main|run)\.go$

      # Same shape one layer down, and the same argument as pkg/engine/segment.go
      # above: ReadCORD19IDs is a streaming pass over a 1.6 GB CSV whose column
      # set differs between CORD-19 releases, so its branches are checks on a
      # file weft did not write.
      - linters:
          - gocyclo
          - funlen
        path: internal/eval/dataset\.go$

      # G404 asks for crypto/rand, which would destroy the thing this file is
      # for. The paired bootstrap resamples from a seed docs/EVAL.md publishes so
      # that a confidence interval can be re-derived years later; an
      # unpredictable source makes every published interval unreproducible. The
      # numbers are resample indices, not secrets.
      - linters:
          - gosec
        text: "G404"
        path: internal/eval/bootstrap\.go$

      # G304 is about a path an attacker chooses. Every one of these is built from
      # the operator's own -data flag on a local research command, and names a
      # file they downloaded or that an earlier subcommand wrote — there is no
      # other party here to defend against, and the harness ships no server and
      # no API. pkg/ is where a path weft did not choose arrives, and this rule
      # does not reach it.
      - linters:
          - gosec
        text: "G304"
        path: (internal/eval|cmd/weft-eval)/

formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/skyoo2003/weft)
    goimports:
      local-prefixes:
        - github.com/skyoo2003/weft
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
