version: 2

# What this ships and what it does not.
#
# It ships `cmd/weft` and `cmd/weftd`, the two command lines in front of the
# library. Neither is the product: weft is a library, and a library is consumed
# with `go get`, which needs no artefact from here. What everything below buys
# is that someone evaluating the project can index a corpus and query it
# without a Go toolchain — from an archive, a Homebrew cask, or a container
# image, whichever they already have the tooling for.
#
# It does not ship `cmd/weft-eval`. That one drives the evaluation harness
# against corpora it downloads, which is something a contributor does from a
# checkout rather than something anyone installs.

project_name: weft

before:
  hooks:
    # No `go mod tidy`: there is nothing to tidy, and it is the one command in
    # this pipeline capable of writing a require line into a go.mod that
    # TestNoExternalDependencies exists to keep empty.
    - go build ./...

builds:
  - id: weft
    main: ./cmd/weft
    binary: weft
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
    # No version stamp. The demo pins its own clock and reads no build
    # metadata, so stamping would mean adding a symbol to main purely so that
    # this file had somewhere to write.

  - id: weftd
    main: ./cmd/weftd
    binary: weftd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  # One archive, both binaries. No `ids:` filter, which is what makes that
  # happen — a second archive would mean a second set of assets, a second
  # checksum line and a second cask, to separate two files that weigh three
  # megabytes together and that anyone trying weftd will want both of.
  #
  # v0.1.0's archive predates weftd and holds only `weft`. Nothing here can
  # change that, and the Homebrew cask published for that tag says so.
  - id: weft
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - NOTICE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# Published to GitHub Packages. The tag is the only tag: no `latest`, and no
# moving `v0.1` either. weft is v0.x, the API may break inside a minor, and
# CHANGELOG.md says so — a tag that silently moves across a breaking change is
# the one thing this repository's release procedure exists to avoid. Pin the
# version you tested against.
#
# `--provenance=false` because attest-build-provenance in the workflow is what
# signs the archives, and a second, differently-shaped attestation buried in
# the image manifest would be two answers to one question. `sbom: false` for
# the same reason: `sboms:` above already produces one per archive, and the
# image holds the same binaries.
dockers_v2:
  - images:
      - ghcr.io/skyoo2003/weft
    dockerfile: Dockerfile.goreleaser
    ids: [weft, weftd]
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    flags:
      - "--provenance=false"
    tags:
      - "{{ .Tag }}"
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: "https://github.com/skyoo2003/weft"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Keyword, vector and graph search engine whose default operation is fusion"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: "Apache-2.0"

# Published to skyoo2003/homebrew-tap. A cask rather than a formula because
# GoReleaser deprecated `brews`, and because a formula that installs a
# pre-built binary is what a cask has always been for. `brew install
# skyoo2003/tap/weft` is the same either way, and weft has never been a formula
# in that tap, so nothing needs a tap_migrations.json entry.
#
# The token is minted per job by the workflow. This repository's own
# GITHUB_TOKEN cannot write to another repository, and a long-lived PAT would
# be one more thing to rotate.
homebrew_casks:
  - ids: [weft]
    binaries:
      - weft
      - weftd
    repository:
      owner: skyoo2003
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/skyoo2003/weft"
    description: "Keyword, vector and graph search engine whose default operation is fusion"
    license: "Apache-2.0"
    # Nothing signs or notarizes these binaries, so Gatekeeper quarantines what
    # the cask staged and the first run dies on a dialog rather than an error.
    # Stripping the attribute is what makes an unsigned cask runnable; it is
    # not an optional nicety.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/weft"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/weftd"]
          end
    caveats: |
      weftd has no authentication and no TLS, and binds 127.0.0.1 for that
      reason. This is not production software — see the Status and Limitations
      sections of https://github.com/skyoo2003/weft.

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # changie owns the release notes; the workflow passes the batched file to
  # --release-notes. Letting GoReleaser also build one from git would put two
  # different accounts of the same release on the same page.
  disable: true

release:
  draft: false
  prerelease: auto
  footer: |
    ---

    weft is a library first. `go get github.com/skyoo2003/weft` needs nothing from this page — the archives exist so the demo can be run without a Go toolchain.

    **This is not production software.** See the Status and Limitations sections of the README.
