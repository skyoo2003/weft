kind: Added
body: '**`pkg/query` — the constraints rank fusion does not express on its own.**
  Rank fusion is a union of votes, so a scorer returning only the documents that
  satisfy a condition expresses a *preference* and not a filter: everything it
  refused comes back on another scorer''s vote, with no error. `docs/ADOPTION.md`
  section 8 is a trial subject losing time to exactly that. `query.Must(fuse,
  streams...)` and `query.MustNot(fuse, streams...)` are the fix, and they compose:
  `query.Must(query.MustNot(fusion.Fuse, 2), 1)` is "matches, and is not a draft".
  Stream indexes are positions in the argument list you already fixed, the same
  convention `fusion.FuseWeighted` uses — so nothing here learns what a scorer is,
  and `go list -deps ./pkg/query` names none. **A stream index past the end of the
  list drops everything**, because a constraint that cannot be evaluated is not
  satisfied and that is the wrong answer that gets noticed. `query.Glob(ix,
  pattern)` is the term-pattern query — `go*` prefix, `*ing` suffix,
  `organi[sz]e` alternation, `gop?er` single character — matched with `path.Match`
  against indexed terms, so a malformed pattern is an error rather than a query
  that quietly returns nothing. It scores TF-IDF, deliberately not BM25: under
  rank fusion a pattern query owes a non-degenerate ordering, not a calibrated
  score. `query.Phrase(ix, inner, phrase)` keeps only the candidates whose text
  holds the phrase as consecutive tokens, decided from `Document.Text` because a
  `Posting` carries a frequency and not a position — cost bounded by what `inner`
  nominates rather than by the corpus. Surviving candidates keep `inner`''s scores,
  so wrapping the text scorer still ranks by BM25. **Both scorers return every
  match rather than truncating to k**, which is what makes them usable as
  restrictions. Not here: fuzzy matching, field restriction, numeric ranges and a
  string query syntax.'
