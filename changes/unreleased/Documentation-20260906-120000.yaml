kind: Documentation
body: 'CONTRIBUTING''s make target reference caught up with the Makefile it is generated
  from. Seven targets the last three milestones added were missing from it entirely:
  `serve` and `serve-grpc` (the two servers over one data directory), `compat` and
  `compat-grpc` (an official OpenSearch client and a stock grpcio client driving them
  unmodified), `grpc-build`, `bench-preflight` and `bench-http`. Three claims had gone
  stale rather than absent: CI runs four checks outside `make all` and not three,
  `make fuzz` covers five targets across two packages and not two segment-decoder ones,
  and `make lint` reaches `grpc/` as well as `bench/`. The list of targets needing a
  prepared corpus gained the two ladder targets that also need one.'
