kind: Exported API
body: '`engine.Index.Neighbors(id) ([]DocID, bool)` is added — the DocIDs a document''s
  `Links` point at, dangling and deleted keys dropped, resolved under one read lock.
  It is `Links` plus `Resolve` because doing those separately costs a traversal both
  halves of what it spends: `Doc` materialises the key, the text and the vector to
  reach a field that is none of them, and `Resolve` takes the index-wide read lock
  once per link. The bool distinguishes a **leaf** (true, empty) from a **missing or
  deleted document** (false), which a traversal needs and `Vector`''s convention would
  have hidden. A Key repeated in `Links` yields its DocID twice, in `Links` order:
  this does not deduplicate. One line of `pkg/engine/testdata/engine_api.txt`;
  `public_api.txt` gains the `scorer/graph` additions — `Adjacency`, `NewAdjacency`,
  `PPR`, `NewPPR`, `Option`, `WithRestart`, `WithPrecision`, `DefaultRestart`,
  `DefaultPrecision`. **Nothing already written stops compiling.** `graph.Scorer`,
  `New`, `NewIncludingSeeds`, `MaxDepth` and `SeedN` are unchanged, so milestone 4''s
  published table is still re-derivable from the same names. The on-disk format is
  **v4, unchanged**: `Neighbors` reads the `docs` records already there and steps over
  the vector by arithmetic rather than decoding it, which is where the saving is — 69%
  of the evaluation corpus''s `docs` section is vector bytes a traversal never reads.'
