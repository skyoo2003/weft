kind: Exported API
body: '`Index.Commit` takes a `context.Context` first: `Commit(ctx, dir)`. Every caller has to
  be edited, which is the whole reason this is filed here rather than under Changed. It is a
  change and not an addition — no `CommitContext` twin exists — because `v0.1.0` is not cut, so
  there is no compatibility to keep, and `Search` already takes a context first. Cancelling
  before the manifest rename reports `ctx.Err()` and publishes nothing, leaving the pending
  documents pending and at most an unnamed `seg-<gen+1>` that `Open` already ignores and the
  next `Commit` already sweeps; cancelling after the rename is ignored, because the commit has
  succeeded and stopping there would leave the directory publishing a generation the live index
  has no mapping for. `Merge` is still uncancellable. docs/DECISIONS.md D-017 carries the
  argument and the two rejected alternatives.'
