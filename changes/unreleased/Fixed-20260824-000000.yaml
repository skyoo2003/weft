kind: Fixed
body: 'A commit no longer stops reads. The worst read due inside a commit window now waits
  **61 ms** where it waited 13.072 s on the same measurement before — 214×, and below the
  191 ms worst read outside the window, so the commit is no longer the worst part of a run.
  The window itself did not move: writing a 20,000-document batch still holds the writer for
  11.3 s and nothing bounds that, but the long part of it is no longer exclusive. `Commit`
  encodes the segment under a read lock and takes the exclusive one only for the manifest
  swap, and a second mutex serialises `Add`, `Close`, `Merge` and `Commit` against each other
  — without it `sync.RWMutex`''s writer preference would let one concurrent `Add` restore the
  whole stall. `Add` still blocks for a whole commit, and `Merge` is unchanged and is a longer
  stop. Measured before and after on one machine with one procedure registered in advance:
  docs/PERF.md section 5.4, docs/FINDINGS.md milestone 9.'
