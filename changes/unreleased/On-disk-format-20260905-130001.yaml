kind: On-disk format
body: '**Version 5.** Each `docs` record gains a field block — `field count
  uvarint`, then `name string` and `text string` per field — appended after the
  timestamp and before the record''s own checksum. No section is added, none
  moves, and `segSectionsFor` hands v3, v4 and v5 the same seven, so **v2 through
  v5 are all read** and a v4 record is a v5 record with the count absent. Version
  1 stays refused. The bump is the point rather than the price: a field''s tokens
  are ordinary postings that count toward the document''s stored length, so a
  build predating fields would read a v5 segment, find frequencies it cannot
  account for against that length, and refuse it as **corrupt** — damage reported
  for a segment that is intact. Stamping the frame with 5 makes it refuse at the
  version check instead. `docs/FORMAT.md` §7.9 records what this cost and the rule
  it leaves behind: version 5 appended to a **record**, which is a checksummed
  unit inside a section whose offsets live in a second file, so one appended field
  moved every record''s checksum, every `docoff` entry behind it and both frame
  checksums. Appending a *section* would have left the record untouched. **Append
  to a section, not to a record, unless the field belongs to the record''s
  identity.**'
