kind: Exported API
body: '`query.Parse(ix, string) (Plan, error)`, the `Plan` struct with its
  `Scorers []engine.Scorer` field, and `Plan.Fuse(engine.Fuser) engine.Fuser` are
  added. `public_api.txt` gains them; `engine_api.txt` does not move and the
  on-disk format is **v5, unchanged** — the parser composes the scorers that
  already existed and adds no index structure. **Nothing already written stops
  compiling.** `Plan.Scorers` is exported and the constraint indexes are not: a
  caller may inspect, reorder or extend the scorer list, and the constraints are
  positions into it that only `Fuse` can apply — reordering `Scorers` after
  parsing therefore invalidates them, which is why `Fuse` is a method rather than
  a free function taking a list.'
