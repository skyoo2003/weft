kind: Added
body: '`Index.Delete(key)` removes an indexed document and `Index.Update(doc)` replaces
  one, so a corpus that changes no longer means a full re-index. A deleted document
  is invisible to all four scorers and to every read method — `Doc`, `Vector`, `DocLen`,
  `Resolve`, `Lookup`, `LookupInto`, `Nearest` — because the tombstone check lives
  inside `engine`''s read path rather than in any scorer: no scorer in the tree mentions
  deletion and `pkg/fusion` is unchanged. `Update` keeps a pending document''s `DocID`
  and spends a new one for a committed document, since a segment cannot be rewritten.
  `Stats` and `AvgDocLen` drop tombstones immediately so BM25 normalizes against the
  live corpus; `Len` deliberately does not, because it is the id bound a corpus-walking
  scorer needs (docs/DECISIONS.md D-018). Nothing is reclaimed: a deleted document
  keeps its bytes and every `Merge` copies them forward, because renumbering would
  move rankings (D-019).'
