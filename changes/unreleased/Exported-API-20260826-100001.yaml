kind: Exported API
body: '`engine.New` and `engine.Open` take `...Option`, and four names are added —
  `Option`, `Tokenizer`, `WithTokenizer`, `Index.Tokenize` — plus the sentinel
  `ErrTokenizerMismatch`. **Nothing already written stops compiling:** a variadic
  parameter is source-compatible, and all 77 `New`/`Open` call sites in this module
  were left as they were. Seven lines of `pkg/engine/testdata/engine_api.txt` moved,
  against a five-to-seven budget written down before the code (docs/FINDINGS.md
  milestone 13 §1.1 and §2); `public_api.txt` did not move, because nothing outside
  `pkg/engine` gained a name. `Scorer`, `Fuser`, `Candidate`, `Document` and `Query`
  are byte-identical, and `pkg/fusion` and the graph, recency and vector scorers have
  a zero diff. **One thing to act on:** `Open` can now fail where it used to succeed.
  It returns `ErrTokenizerMismatch` when the directory''s documents were split by a
  tokenizer other than the one passed, which is traded against every query answering
  zero hits for the life of the index. Pass the same `WithTokenizer` the commit was
  made with — or none, if the commit used none, which is every directory weft has
  written until now. The on-disk format is **v4, unchanged**: the check recomputes one
  live document''s token count and compares it against the number `docoff` already
  stores, so v3 and v4 directories still open with nothing converted.'
