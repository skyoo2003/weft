kind: Added
body: weft now publishes a container image to `ghcr.io/skyoo2003/weft` and a Homebrew cask to `skyoo2003/homebrew-tap` on every tag, both carrying `weftd` alongside the `weft` CLI. v0.1.0 was backfilled into both channels, and its cask installs the CLI alone because that is all its archives held.
