body: 'Every document is about half as long and says the same things: 17,198 lines
  become 7,240 with every figure, interval, verdict and falsification condition intact,
  because what was cut is density rather than measurement. Three stale numbers were
  corrected against the code that decides them — the DSL refusal rate is 6 of 25 rows,
  24.0%, and `pkg/` holds 11,039 implementation and 15,427 test lines — and no exported
  API moved and no `.go` file was touched.'
