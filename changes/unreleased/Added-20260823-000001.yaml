kind: Added
body: '`Index.LookupInto(term, buf)` is `Lookup` writing into a buffer you own, so a caller
  walking several terms holds the longest posting list instead of the sum of them. That sum
  was 53.2% of what a query allocated on the evaluation corpus — a term''s whole posting
  list, per term, per query — and `pkg/scorer/text` now reuses one buffer across a query''s
  terms: 10,869.0 KiB per query against 15,691.3, with nDCG@10 identical to four decimals.
  The answer does not change: the same postings in the same ascending order, committed
  segments before pending, and the same absence when a segment claims a term it cannot
  decode. That last one is why this is a buffer and not an iterator — the verdict arrives
  after some postings are decoded, and postings held in a buffer can be discarded where
  yielded ones cannot, a partial posting list being a wrong answer rather than a short one.
  The read lock spans the same walk `Lookup`''s does and nothing of the caller''s runs inside
  it, so scoring may still ask for a document length per posting. The result is yours to
  modify, which `Lookup`''s is not, and it is yours only until the next call with the same
  buffer. `pkg/fusion` is untouched and `go list -m all` is still one line.'
