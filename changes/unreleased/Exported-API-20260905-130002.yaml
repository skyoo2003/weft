kind: Exported API
body: '**`engine.Document` gains a sixth field, so an unkeyed composite literal
  stops compiling.** `engine.Document{"k", "text", nil, nil, t}` must become a
  keyed literal; every call site in this module already used keys and none
  changed. That is the one break. Added: the `Field` struct, `Document.Fields
  []Field`, `func FieldTerm(name, token string) string`, the sentinel
  `ErrBadField`, and `text.NewField(ix, field) *Scorer`. `text.Scorer.Name` now
  answers `"text:title"` for a field-scoped scorer and is unchanged at `"text"`
  for the plain one, so milestone 4''s published arms still name themselves the
  same way. Six lines of `pkg/engine/testdata/engine_api.txt`; `public_api.txt`
  gains `NewField` under `scorer/text`. Two things that follow and are not
  obvious: `DocLen` and `AvgDocLen` now count every field''s tokens for a document
  that has any, because field terms are ordinary postings and `Scrub` checks a
  document''s frequencies against its stored length — so adding a field to an
  existing corpus changes BM25 scores for those documents. And `Open` reports
  `ErrTokenizerMismatch` against the full token count, fields included, so the
  guard keeps meaning what it says.'
