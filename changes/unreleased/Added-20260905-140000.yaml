kind: Added
body: '**The load ladder can now be aimed through a socket, and it reports the
  server''s memory rather than its own.** `weft-eval bench -http 127.0.0.1:9200`
  drives a running `weftd` with the same open loop, the same rung structure, the
  same saturation rule and the same suspension tolerance the in-process ladder has
  used since milestone 5, so the difference between the two runs is the HTTP
  surface and the second process and nothing else. `make bench-http` starts the
  server, waits for it to listen, runs the ladder and stops it. **The part that
  decides whether such a run means anything is where the numbers come from.** A
  load generator can only read its own counters, and over HTTP that process holds
  the in-flight requests and no index at all — printing its resident set in the RSS
  column would be a number that is precise, stable, reproducible and about the
  wrong program. So `weftd` answers `GET /_nodes/stats` with its own peak RSS, page
  faults, GC cycles, pause total, GC CPU share and allocation counters, read from
  the same instruments `internal/loadgen` reads in-process, and the ladder reads
  them between rungs. If that read fails the run **ends** rather than falling back
  to the local counters, because the fallback would be wrong in exactly the way
  nobody checks for. The HTTP arm also does not open the local index — mapping 626
  MiB into a process that never searches it would cost that mapping before a typo
  in the address was even reported — and `-writes` with `-http` is refused, since
  the write-lock probe commits into its own copy and would time a commit the
  measured reads never contend with. **No judgment is published yet**: the run
  needs the same quiet three-hour window every ladder needs, and this is the
  harness, not the measurement.'
