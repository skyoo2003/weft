kind: Documentation
body: 'Two questions the PRD had left open are now answered where they can be read
  rather than rediscovered. `docs/DECISIONS.md` D-022 prices the four places the
  tokenizer seam could have attached and says why three were rejected — a package
  variable races an `Add` and cannot give two indexes different tokenizers, a
  `NewWithTokenizer` pair doubles the entry points on the ground D-020 rejected
  `SearchDeep`, and a required argument buys the same thing for 77 broken call sites.
  D-023 does the same for the mismatch check, including the rejected alternative
  (storing the tokenizer''s name, because a Go function value has no stable one and a
  caller-supplied label can lie) and the third check that was written and taken back
  out: comparing recomputed terms against the segment''s terms index reported a
  doctored `terms` section as a tokenizer mismatch, which is the wrong diagnosis and
  put verification back into `Open` where D-006 had removed it. `FORMAT.md` §4 records
  that milestone 13 turned its own warning — recomputing a token count would let a
  tokenizer replacement disagree silently with existing postings — into a check, and
  §8 publishes the four ceilings that leaves: a count-preserving tokenizer such as a
  stemmer passes, the sample is one document, a textless corpus is admitted, and a
  non-deterministic tokenizer fails against itself. `README.md`''s limitations table
  carries both rows, `ADOPTION.md` records that a replaceable tokenizer is still not a
  field concept, and `bench/README.md` records that the bleve comparison keeps the
  default deliberately and stays analyzer-unmatched.'
