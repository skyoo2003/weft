kind: Added
body: '**Hybrid search over HTTP, and the fourth signal that measures what the wire
  charges for one.** `knn` becomes a `scorer/vector` stream, `hybrid` fuses any
  number of sub-queries through `fusion.Fuse`, and an optional `weights` array —
  weft''s, not OpenSearch''s, which puts the weighting in a search pipeline —
  becomes `fusion.FuseWeighted`. A weight attaches to a **position** and never to a
  name, so `go list -deps ./pkg/fusion` still names no scorer package: that is
  D-005''s repayment reaching the wire, where a client can now turn down a stream
  with nothing to say without the fusion learning what the stream holds.
  `search_pipeline` is refused with a 400 that states the thesis — normalizing two
  streams onto a common scale is the step this server does not have, because rank
  fusion reads position and never score. `function_score` with a `gauss`, `exp` or
  `linear` decay becomes a `scorer/recency` stream, on the date field a mapping
  marks with `"recency": true`; the decay''s *parameters* are refused, because
  `scorer/recency` has a fixed half-life and reading `scale` to ignore it would rank
  by a curve nobody asked for. **What the round bought is a number.** Adding that
  fourth signal changed **0 lines** of fusion code — asserted structurally, not by
  eye — and cost 57 lines in its query clause, inside milestone 1''s hundred-line
  budget. Counted the way milestone 1 counted, the whole change is 127 lines and
  over budget, and the 27-line difference is one sentence: **the wire has no place
  to say "this date is the document''s time."** In a Go program filling
  `Document.Time` is a field assignment; over HTTP the binding has to be carried by
  a mapping. The query half is as cheap as the architecture promised; the surcharge
  is the protocol.'
