kind: Added
body: '**Named fields, so a query can ask about one part of a document.**
  `engine.Document` gains `Fields []Field`, each a `{Name, Text}` indexed beside
  `Text`, and `text.NewField(ix, "title")` is a BM25 scorer that reads one of
  them. A field is a **term space, not a section**: every field is split by the
  same `Tokenizer` and its terms go into the same postings under
  `name + NUL + token`, which `engine.FieldTerm` spells and exports so a scorer
  written outside the module can build the same key. So nothing in the index
  learned what a field means, no new section or table was added, and searching two
  fields is two scorers and fusion between them rather than a feature of one. A
  term in `Text` and the same term in a field are **different terms** — that is
  what makes a scoped query mean anything, and a caller wanting a word findable
  both ways puts it in both places. `ErrBadField` refuses a name that is empty,
  holds the separator, or repeats within one document; each is a term space no
  lookup could reach, and a segment carrying one is refused as corrupt.
  **The field-scoped scorer does not normalize by length**, and that is a
  decision rather than an omission: a document''s stored token count is Text plus
  every field with no record of which was which, so normalizing a five-token
  title by a five-thousand-token body would rank by brevity. B is 0 there. What
  it gives up is separating two equally good field matches by field length; a
  per-field count is a format v6 and is not bought before something measures it.'
