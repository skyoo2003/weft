kind: Added
body: '**weftd now has a surface of its own, next to the OpenSearch one.**
  `POST /{index}/_weft/search` takes a request that *is* a stream list —
  `{"streams": [...], "weights": [...], "depth": N, "breakdown": true}` — and it
  says three things the OpenSearch DSL has no way to say. A **positional stream
  list**: `hybrid` was always a wrapper around one and `weights` was weft''s
  extension to that wrapper, so here the list is the query and a weight is an
  index into a list the client wrote. A **breakdown**: one column per stream,
  holding where that stream ranked the document *before* fusion saw any of them,
  and `null` where it had no opinion — the `-` column `examples/breakdown` prints,
  which an OpenSearch response has nowhere to put. And **`depth` separate from
  `size`**: on `_search` a knn clause''s `k` raises the candidate depth of every
  stream at once, and a text-only query cannot ask for a deeper fusion at all.
  It is not a second parser. A stream is compiled by the same function `_search`
  compiles a leaf with, so all eleven leaf clause kinds are streams here and every
  refusal in the compatibility table is inherited rather than re-listed —
  `hybrid`''s own loop moved out and both callers share it. The route lives under
  `/_weft/` because what OpenSearch has no name for gets a name OpenSearch does not
  use (D-033), and it cannot collide with an index because an index name may not
  begin with an underscore. **`pkg/` changed zero lines** and `opensearch-py` 3.2.0
  still drives weftd unmodified.'
